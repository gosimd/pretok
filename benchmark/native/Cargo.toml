[package]
name = "pretok-reference"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
onig = { version = "=6.5.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
